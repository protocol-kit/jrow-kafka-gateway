# Docker Compose stack for jrow-kafka-gateway: a single-node Kafka broker
# (KRaft mode, no Zookeeper) plus the gateway itself. Used for local
# development and by ./e2e-test.sh.
#
# Usage:
#   docker compose up -d --build
#   docker compose logs -f jrow-kafka-gateway
#   docker compose down -v

services:
  # Single-node Kafka broker (combined broker+controller, KRaft mode)
  kafka:
    image: apache/kafka:latest
    hostname: broker
    ports:
      - "9092:9092" # host access (PLAINTEXT_HOST)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_HOST://localhost:9092,PLAINTEXT://broker:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      - gateway

  # jrow-kafka-gateway, built from this directory's Dockerfile. jrow-* crates
  # are fetched from github.com/protocol-kit/jrow at build time (see
  # Cargo.toml), so the build context is just this directory.
  jrow-kafka-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9950:9950" # jrow-server WebSocket
      - "8090:8090" # health/stats endpoint
    volumes:
      - ./config.e2e.toml:/home/jrow/config.toml:ro
      - gateway-data:/data
    command: ["--config", "/home/jrow/config.toml", "--verbose"]
    networks:
      - gateway

volumes:
  gateway-data:
    driver: local

networks:
  gateway:
    driver: bridge
